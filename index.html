<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naija Mall - Shop Local Businesses</title>
  <style>
    body { font-family: Arial; background: #f5f5f5; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #008751; }
    .nav { text-align: center; margin-bottom: 20px; }
    .nav a { background: #008751; color: white; padding: 10px 20px; border-radius: 5px; text-decoration: none; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
    .card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .card img { width: 100%; height: 200px; object-fit: cover; }
    .card-content { padding: 15px; }
    .card h3 { margin: 0 0 5px 0; color: #333; }
    .category { background: #008751; color: white; padding: 3px 8px; border-radius: 5px; font-size: 12px; display: inline-block; }
    .phone { margin-top: 10px; font-weight: bold; color: #008751; }
  </style>
</head>
<body>
  <h1>🇳🇬 Naija Mall</h1>
  <div class="nav">
    <a href="seller.html">+ Add Your Business</a>
  </div>
  <div class="grid" id="businessGrid">
    Loading businesses...
  </div>

  <script type="module">
    import { db } from './firebase.js';
    import { collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const grid = document.getElementById('businessGrid');

    async function loadBusinesses() {
      const q = query(collection(db, "businesses"), orderBy("createdAt", "desc"));
      const querySnapshot = await getDocs(q);
      
      if (querySnapshot.empty) {
        grid.innerHTML = "<p style='text-align:center;'>No businesses yet. Be the first to add yours!</p>";
        return;
      }

      grid.innerHTML = "";
      querySnapshot.forEach((doc) => {
        const business = doc.data();
        const card = `
          <div class="card">
            <img src="${business.imageUrl}" alt="${business.name}">
            <div class="card-content">
              <h3>${business.name}</h3>
              <span class="category">${business.category}</span>
              <p>${business.description}</p>
              <p>📍 ${business.address}</p>
              <p class="phone">📞 ${business.phone}</p>
            </div>
          </div>
        `;
        grid.innerHTML += card;
      });
    }

    loadBusinesses();
  </script>
</body>
</html>
