<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Become a Seller - Naija Mall</title>
  <style>
    body { font-family: Arial; background: #f5f5f5; padding: 20px; }
    .form-box { background: white; max-width: 500px; margin: auto; padding: 20px; border-radius: 10px; }
    input, textarea, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
    button { background: #00B14F; color: white; padding: 15px; border: none; width: 100%; border-radius: 5px; font-size: 16px; }
    h2 { text-align: center; color: #00B14F; }
  </style>
</head>
<body>
  <div class="form-box">
    <h2>🏪 Post Your Business</h2>
    <p style="text-align:center;">It's FREE to sell on Naija Mall</p>
    
    <form>
      <label>Business Name</label>
      <input type="text" placeholder="e.g. Mac's Fashion Hub" required>

      <label>WhatsApp Number</label>
      <input type="tel" placeholder="e.g. 08012345678" required>

      <label>Location</label>
      <input type="text" placeholder="e.g. Lagos, Nigeria" required>

      <label>Category</label>
      <select>
        <option>Fashion</option>
        <option>Food</option>
        <option>Gadgets</option>
        <option>Beauty</option>
        <option>Home</option>
        <option>Services</option>
      </select>

      <label>Product Description</label>
      <textarea rows="4" placeholder="What are you selling?"></textarea>

      <button type="submit">SUBMIT BUSINESS</button>
    </form>

    <p style="text-align:center; margin-top:15px;">
      <a href="index.html">← Back to Mall</a>
    </p>
  </div>
</body>
</html>
